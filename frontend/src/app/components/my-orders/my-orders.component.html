<div class="main-content page-m mt-4">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
      <h4 class="mb-3">My Orders</h4>

      <div *ngIf="isLoading" class="alert alert-info">Loading your orders...</div>
      <div *ngIf="!isLoading && loadError" class="alert alert-danger">
        {{ loadError }}
        <button (click)="getOrders()" class="btn btn-secondary btn-sm ms-2">Retry</button>
      </div>
      <div *ngIf="!isLoading && !loadError && orders.length === 0" class="alert alert-info">
        You have no orders yet.
        <a routerLink="/products" class="ms-2">Start shopping</a>
      </div>

      <table *ngIf="!isLoading && !loadError && orders.length > 0" class="table table-bordered cart-table">
        <thead>
          <tr>
            <th>Tracking Number</th>
            <th>Date</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of orders">
            <td class="tracking-number">{{ order.orderTrackingNumber }}</td>
            <td>{{ order.dateCreated | date:'short' }}</td>
            <td>{{ order.totalQuantity }}</td>
            <td>{{ order.totalPrice | number:'1.2-2' }}</td>
            <td>
              <span class="badge {{ badgeClass(order.status) }}">{{ order.status }}</span>
            </td>
            <td>
              <a [routerLink]="['/my-orders', order.id]" class="btn btn-primary btn-sm">View</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
