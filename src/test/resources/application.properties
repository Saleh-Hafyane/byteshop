# Test-only configuration. This file lives on the test classpath and therefore
# SHADOWS src/main/resources/application.properties during `mvn test`, making the
# suite hermetic: in-memory H2 instead of the dev MySQL in Docker.
spring.application.name=ecommerce (test)

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:byteshop-test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Schema is generated from the JPA entities, then seed rows are inserted
# (same catalog/city rows as byteshop_schema.sql so purchase tests find product id 1).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed-data-test.sql

spring.data.rest.base-path=/api
spring.jpa.open-in-view=false
